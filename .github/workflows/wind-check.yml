name: Wind check

on:
  schedule:
    # Every 5 minutes, offset from the top of the hour (GitHub delays busy slots).
    # Free in public repositories; a private repository would exceed the free minutes.
    - cron: "2-57/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write # to publish state and the status page to the "status" branch

concurrency:
  group: wind-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore state from the last run
        run: |
          mkdir -p public
          if git fetch --quiet --depth=1 origin status 2>/dev/null; then
            git show FETCH_HEAD:state.json > public/state.json 2>/dev/null || rm -f public/state.json
          fi

      - name: Check wind
        env:
          LATITUDE: ${{ secrets.LATITUDE }}
          LONGITUDE: ${{ secrets.LONGITUDE }}
          GOVEE_API_KEY: ${{ secrets.GOVEE_API_KEY }}
          GOVEE_DEVICES: ${{ secrets.GOVEE_DEVICES }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python -m windguard check

      - name: Publish state and status page
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          [ -f public/state.json ] || exit 0
          cp site/index.html public/index.html
          cd public
          git init --quiet --initial-branch=status
          git config user.name "wind-check"
          git config user.email "wind-check@users.noreply.github.com"
          git add -A
          git commit --quiet -m "Wind status update"
          git push --quiet --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" status
