# Wind monitor settings. Private values (location, keys, device IDs) do NOT go here;
# they are GitHub Actions secrets (or a local .env file) - see README.

[wind]
# Turn the inflatables off when gusts now, or forecast within the look-ahead
# window, reach this speed.
gust_threshold_mph = 20

# The wind counts as "passed" once the peak gust is below this. Keeping it a
# little under the threshold stops on/off flapping on borderline days.
resume_below_mph = 17

# How far ahead to look at the forecast.
lookahead_hours = 3

# How long the forecast must stay calm before you get the all-clear message.
calm_minutes = 30

[notify]
ntfy_server = "https://ntfy.sh"

# Optional: your status page address. Tapping a notification opens it.
status_page_url = ""
