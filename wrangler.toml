name = "wind-watch"
main = "src/index.js"
compatibility_date = "2026-10-01"

# The dashboard page. Anything not found here (status.json, history.json, /api/check)
# is handled by the Worker.
[assets]
directory = "./public"
binding = "ASSETS"

# Wind check every 5 minutes.
[triggers]
crons = ["*/5 * * * *"]

# State, latest status and 7-day history.
[[d1_databases]]
binding = "DB"
database_name = "wind-watch"
database_id = "558d542e-b3a9-4d0d-8737-08db22a23888"

[observability]
enabled = true

# Settings. Private values (LATITUDE, LONGITUDE, GOVEE_API_KEY, GOVEE_DEVICES,
# NTFY_TOPIC) are Cloudflare secrets: see README.
[vars]
# High wind: sustained wind at or above SUSTAINED_THRESHOLD_MPH, or gusts at or
# above GUST_THRESHOLD_MPH. Leave SUSTAINED_THRESHOLD_MPH empty to use gusts only.
SUSTAINED_THRESHOLD_MPH = "25"
GUST_THRESHOLD_MPH = "35"
# Turn the inflatables off this many minutes before high wind is forecast.
LEAD_MINUTES = "30"
# The wind counts as passed once wind and gusts both stay below these...
RESUME_BELOW_SUSTAINED_MPH = "22"
RESUME_BELOW_MPH = "32"
# ...for the whole look-ahead window, and have done so for this long.
LOOKAHEAD_HOURS = "3"
CALM_MINUTES = "30"
NTFY_SERVER = "https://ntfy.sh"
# Tapping a notification opens this page.
STATUS_PAGE_URL = "https://wind-watch.wind-watch.workers.dev/"
